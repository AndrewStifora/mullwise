name: Feature / change
description: A new capability or improvement
labels: ["type:feat"]
body:
  - type: textarea
    id: job
    attributes:
      label: Job to be done
      description: "When ___, I want to ___, so I can ___."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable statements. These become tests.
      placeholder: |
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      options:
        - "phase:1 (local, desktop)"
        - "phase:2 (hosted connector, mobile, integrations)"
        - "phase:3 (standalone app)"
        - unsure
  - type: checkboxes
    id: sensitive
    attributes:
      label: Touches sensitive areas?
      options:
        - label: Stored user data / encryption / keys
        - label: Network (listener, outbound call, auth)
        - label: MCP tool definitions or outputs (LLM-facing)
