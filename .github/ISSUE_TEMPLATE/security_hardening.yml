name: Security hardening / review task
description: Planned security work (threat-model item, review finding, hardening). NOT for reporting vulnerabilities.
labels: ["type:security", "security-review"]
body:
  - type: markdown
    attributes:
      value: "To report a vulnerability, use *Security → Report a vulnerability* (private)."
  - type: dropdown
    id: stride
    attributes:
      label: STRIDE category
      options:
        - Spoofing
        - Tampering
        - Repudiation
        - Information disclosure
        - Denial of service
        - Elevation of privilege
        - Prompt injection / LLM-specific
        - Supply chain
    validations:
      required: true
  - type: textarea
    id: threat
    attributes:
      label: Threat / finding
    validations:
      required: true
  - type: textarea
    id: mitigation
    attributes:
      label: Proposed mitigation and how it will be tested
    validations:
      required: true
